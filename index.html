<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neptün & Jüpiter // Kozmik İletişim Ağı</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --primary-gradient: linear-gradient(135deg, #00f2fe 0%, #0072ff 100%);
            --primary-glow: rgba(0, 242, 254, 0.5);
            --primary-bg: rgba(0, 242, 254, 0.12);
            --primary-border: rgba(0, 242, 254, 0.4);
            --primary-text: #00f2fe;
            --space-bg: radial-gradient(circle at 50% 40%, #08244a 0%, #030d22 60%, #010512 100%);
            --card-bg: rgba(8, 16, 34, 0.82);
            --card-border: rgba(0, 242, 254, 0.4);
            --card-shadow: 0 0 70px rgba(0, 242, 254, 0.25);
        }

        body.theme-jupiter {
            --primary: #ff8c3b;
            --primary-gradient: linear-gradient(135deg, #ff8c3b 0%, #ff4500 100%);
            --primary-glow: rgba(255, 140, 0, 0.6);
            --primary-bg: rgba(255, 120, 30, 0.2);
            --primary-border: rgba(255, 120, 30, 0.5);
            --primary-text: #ffaa55;
            --space-bg: radial-gradient(circle at 50% 40%, #521d03 0%, #260a01 60%, #0c0200 100%);
            --card-bg: rgba(30, 12, 4, 0.85);
            --card-border: rgba(255, 120, 30, 0.5);
            --card-shadow: 0 0 75px rgba(255, 90, 0, 0.4);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Space Grotesk', sans-serif; transition: background 0.4s, border-color 0.4s, box-shadow 0.4s, color 0.3s; }
        html, body { height: 100%; height: 100dvh; overflow: hidden; position: relative; background: var(--space-bg); color: #e2e8f0; }
        
        #stars-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        #gateway-screen {
            position: fixed; inset: 0; z-index: 100; background: transparent;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: calc(16px + env(safe-area-inset-top)) 16px 16px 16px; text-align: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .entry-global-counter {
            background: var(--primary-bg); border: 1px solid var(--primary-border);
            color: var(--primary-text); font-family: 'Fira Code', monospace; font-size: 11px;
            padding: 6px 14px; border-radius: 20px; margin-bottom: 14px;
            display: inline-flex; align-items: center; gap: 8px; letter-spacing: 1px;
            box-shadow: 0 0 15px var(--primary-bg); backdrop-filter: blur(8px);
        }
        .pulse-dot { width: 7px; height: 7px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.25); opacity: 1; } }

        .planet-selector-wrapper { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 16px; position: relative; width: 100%; max-width: 480px; }
        .planet-nav-btn {
            background: rgba(10, 18, 36, 0.75); border: 1px solid var(--primary-border);
            color: var(--primary-text); width: 44px; height: 44px; border-radius: 50%;
            font-size: 22px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(8px); user-select: none; flex-shrink: 0;
        }
        .planet-nav-btn:hover { background: var(--primary-bg); border-color: var(--primary); transform: scale(1.12); box-shadow: 0 0 20px var(--primary-glow); }

        .planet-box { position: relative; width: 130px; height: 130px; }
        .planet-svg { width: 100%; height: 100%; transition: all 0.5s ease; }

        .gateway-card {
            background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: var(--card-shadow);
            border-radius: 20px; padding: 24px 20px; max-width: 420px; width: 92vw;
            position: relative; overflow: hidden; backdrop-filter: blur(14px); transition: all 0.5s ease;
        }
        .gateway-card::before { content: ''; position: absolute; top:0; left:0; width:100%; height:3px; background: var(--primary-gradient); }

        .badge-title {
            display: inline-block; font-family: 'Fira Code', monospace; font-size: 10.5px;
            color: var(--primary-text); background: var(--primary-bg); border: 1px solid var(--primary-border);
            padding: 4px 12px; border-radius: 20px; letter-spacing: 1.2px; margin-bottom: 12px; text-transform: uppercase;
        }
        .gateway-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px; letter-spacing: 0.5px; line-height: 1.35; }
        .gateway-desc { font-size: 12px; color: #94a3b8; line-height: 1.5; margin-bottom: 16px; }

        .input-group { position: relative; margin-bottom: 12px; }
        .pass-input {
            width: 100%; background: rgba(3, 6, 17, 0.85); border: 1px solid var(--primary-border);
            color: var(--primary-text); padding: 11px 14px; border-radius: 12px; font-family: 'Fira Code', monospace;
            font-size: 13.5px; outline: none; transition: all 0.3s;
        }
        .pass-input:focus { border-color: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }

        .btn-submit {
            width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--primary-gradient);
            color: #030611; font-weight: 700; font-size: 13.5px; letter-spacing: 1px; cursor: pointer;
            transition: all 0.3s; box-shadow: 0 0 25px var(--primary-glow);
        }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-2px); }

        .btn-settings-trigger {
            position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 14px; z-index: 200;
            background: var(--primary-bg); border: 1px solid var(--primary-border); color: var(--primary-text);
            padding: 7px 14px; border-radius: 20px; font-size: 12px; font-family: 'Fira Code', monospace;
            cursor: pointer; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <button class="btn-settings-trigger" id="audio-settings-btn">
        <span>🔊</span> <span>AYARLAR</span>
    </button>

    <div id="gateway-screen">
        <div class="entry-global-counter">
            <span class="pulse-dot"></span>
            <span>CANLI KOZMONOT: <strong id="global-live-count">1</strong></span>
        </div>

        <div class="planet-selector-wrapper">
            <button class="planet-nav-btn" onclick="togglePlanetMode()">‹</button>
            <div class="planet-box">
                <svg id="neptune-svg" class="planet-svg" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="32" fill="#0072ff" />
                </svg>
                <svg id="jupiter-svg" class="planet-svg" viewBox="0 0 120 120" style="display:none;">
                    <circle cx="60" cy="60" r="31" fill="#ff4500" />
                </svg>
            </div>
            <button class="planet-nav-btn" onclick="togglePlanetMode()">›</button>
        </div>

        <div class="gateway-card">
            <div class="badge-title" id="card-badge">Soğuk Dereceler Erişimi</div>
            <h1 class="gateway-title" id="card-title">NEPTÜN AĞI // FREKANS KİLİDİ</h1>
            <p class="gateway-desc" id="card-desc">Sisteme girmek için güvenli frekans kodunuzu girin.</p>
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="password" id="passcode-input" class="pass-input" placeholder="FREKANS KODU" />
                </div>
                <button type="submit" class="btn-submit" id="card-submit-btn">FREKANSA BAĞLAN</button>
            </form>
        </div>
    </div>

    <script>
        let currentPlanetMode = 'neptune';

        /* --- GEZEGEN VE TEMA DEĞİŞTİRME --- */
        function togglePlanetMode() {
            // Hipersürücü / Warp efektini tetikle
            triggerWarpEffect();

            const badge = document.getElementById('card-badge');
            const title = document.getElementById('card-title');
            const desc = document.getElementById('card-desc');
            const passInput = document.getElementById('passcode-input');
            const submitBtn = document.getElementById('card-submit-btn');
            const neptuneSvg = document.getElementById('neptune-svg');
            const jupiterSvg = document.getElementById('jupiter-svg');

            if (currentPlanetMode === 'neptune') {
                currentPlanetMode = 'jupiter';
                document.body.classList.add('theme-jupiter');
                neptuneSvg.style.display = 'none';
                jupiterSvg.style.display = 'block';
                badge.textContent = "GELİŞTİRİCİ ERİŞİM KANALI";
                title.textContent = "JÜPİTER GELİŞTİRİCİ AĞI // FREKANS KİLİDİ";
                desc.textContent = "Geliştirici moduna erişmek için özel Jüpiter frekans kodunuzu girin.";
                passInput.placeholder = "GELİŞTİRİCİ FREKANS KODU";
                submitBtn.textContent = "GELİŞTİRİCİ FREKANSA BAĞLAN";
            } else {
                currentPlanetMode = 'neptune';
                document.body.classList.remove('theme-jupiter');
                jupiterSvg.style.display = 'none';
                neptuneSvg.style.display = 'block';
                badge.textContent = "Soğuk Dereceler Erişimi";
                title.textContent = "NEPTÜN AĞI // FREKANS KİLİDİ";
                desc.textContent = "Sisteme girmek için güvenli frekans kodunuzu girin.";
                passInput.placeholder = "FREKANS KODU";
                submitBtn.textContent = "FREKANSA BAĞLAN";
            }
        }

        /* --- CANLI WARP / HİPERSÜRÜCÜ CANVAS MANTIĞI --- */
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let warpSpeed = 0;
        let isWarping = false;

        function triggerWarpEffect() {
            isWarping = true;
            warpSpeed = 35; // Warp başlangıç hızı
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            stars = Array.from({length: 350}, () => ({
                x: (Math.random() - 0.5) * window.innerWidth * 2,
                y: (Math.random() - 0.5) * window.innerHeight * 2,
                z: Math.random() * window.innerWidth,
                size: Math.random() * 1.8 + 0.5
            }));
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function animateStars() {
            // Warp esnasında iz bırakabilmek için tuval yarı-saydam temizlenir
            if (isWarping) {
                ctx.fillStyle = 'rgba(2, 6, 18, 0.22)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            const isJup = document.body.classList.contains('theme-jupiter');
            const starColor = isJup ? '255, 140, 0' : '0, 242, 254';
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            stars.forEach(s => {
                s.z -= isWarping ? warpSpeed : 0.4;
                if (s.z <= 0) {
                    s.z = canvas.width;
                    s.x = (Math.random() - 0.5) * canvas.width * 2;
                    s.y = (Math.random() - 0.5) * canvas.height * 2;
                }

                let k = 200 / s.z;
                let px = s.x * k + cx;
                let py = s.y * k + cy;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    if (isWarping) {
                        // Merkezden dışa doğru uzayan çizgi hesabı
                        let prevK = 200 / (s.z + warpSpeed * 1.2);
                        let prevPx = s.x * prevK + cx;
                        let prevPy = s.y * prevK + cy;

                        ctx.strokeStyle = `rgba(${starColor}, ${Math.min(1, 1 - s.z / canvas.width)})`;
                        ctx.lineWidth = s.size * 2;
                        ctx.beginPath();
                        ctx.moveTo(prevPx, prevPy);
                        ctx.lineTo(px, py);
                        ctx.stroke();
                    } else {
                        // Normal duruştaki sabit parlayan yıldızlar
                        ctx.fillStyle = `rgba(${starColor}, ${1 - s.z / canvas.width})`;
                        ctx.beginPath();
                        ctx.arc(px, py, s.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });

            // Warp Hızının Sönümlenmesi (Fritksiyon)
            if (isWarping) {
                warpSpeed *= 0.91;
                if (warpSpeed < 0.6) {
                    warpSpeed = 0;
                    isWarping = false;
                }
            }

            requestAnimationFrame(animateStars);
        }
        animateStars();
    </script>
</body>
</html>
